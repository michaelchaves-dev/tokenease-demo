<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenEase · Inference Demo</title>
  <style>
    :root { color-scheme: dark light; --bg:#0a0f0d; --text:#e7ece8; --muted:#8a928c; --accent:#73d7bd; --card:#121d19; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .wrap { max-width:520px; padding:2rem; text-align:center; }
    h1 { font-size:1.5rem; margin:0 0 .5rem; letter-spacing:-.02em; }
    p { color:var(--muted); margin:0 0 1.75rem; line-height:1.5; }
    .cards { display:flex; flex-direction:column; gap:.75rem; }
    a { display:block; padding:1rem 1.25rem; background:var(--card); border:1px solid #283832; border-radius:.75rem; color:var(--text); text-decoration:none; transition:.15s; }
    a:hover { border-color:var(--accent); color:var(--accent); }
    a strong { display:block; margin-bottom:.25rem; }
    a span { font-size:.875rem; color:var(--muted); }
    footer { margin-top:2rem; font-size:.75rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TokenEase · Live Demo</h1>
    <p>Subtraction first. Route cheaper. Prove the savings.</p>
    <div class="cards">
      <a href="./inferenceconsole.html">
        <strong>Inference Console</strong>
        <span>Create and route inference traffic</span>
      </a>
      <a href="./inferencesavingsdashboard.html">
        <strong>Savings Dashboard</strong>
        <span>See tokens + dollars saved</span>
      </a>
    </div>
    <footer>Quantum Subtraction Cipher · Engineering by Subtraction</footer>
  </div>
</body>
</html>
